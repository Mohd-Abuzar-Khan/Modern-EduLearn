server.port=${SERVER_PORT:8080}
spring.application.name=edulearn-monolith

# Default database is the provided Railway MySQL instance.
spring.datasource.url=${DB_URL:jdbc:mysql://shinkansen.proxy.rlwy.net:12559/edulearn?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root@123}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

jwt.secret=${JWT_SECRET:mySecretKeyForJWTAuthenticationInEduLearnMicroserviceArchitecture2024SuperSecureKey123!@#}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Internal service calls are routed back to this same process in monolith mode.
monolith.internal.base-url=${MONOLITH_INTERNAL_BASE_URL:http://localhost:8080}
course.service.url=${COURSE_SERVICE_URL:http://localhost:8080/api/v1}
enrollment.service.url=${ENROLLMENT_SERVICE_URL:http://localhost:8080/api/v1}
lesson.service.url=${LESSON_SERVICE_URL:http://localhost:8080}

certificate.output.path=${CERTIFICATE_OUTPUT_PATH:certificates/}
app.upload.path=${APP_UPLOAD_PATH:uploads/videos}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_SaupXqCsXJ8hEW}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:TRRkjEddjFMhNAQQ8n5evEUQ}

# Disable service discovery concerns for monolith runtime.
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.compatibility-verifier.enabled=false

# Avoid startup failure from duplicated bean names inherited from services.
spring.main.allow-bean-definition-overriding=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

logging.level.root=INFO
logging.level.com.edulearn=INFO


